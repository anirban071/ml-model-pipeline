apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ml-model-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/anirban071/ml-model-pipeline.git
    targetRevision: main
    path: k8s
    directory:
      # kind-config.yaml configures the local kind cluster; it is not a Kubernetes resource
      exclude: kind-config.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true     # delete cluster resources that were removed from Git
      selfHeal: true  # undo manual changes made directly in the cluster
